workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2
    working_directory: pos
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS App & Package IPA
        script: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r pos.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - aliasgharinnocent@yahoo.com
        notify:
          success: true
          failure: true
